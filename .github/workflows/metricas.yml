# ---------------------------------------------------------------------------
# MÉTRICAS DO INSTAGRAM — coleta diária e painel
# ---------------------------------------------------------------------------
# Lê seguidores e o desempenho de cada post pela API oficial e atualiza:
#   data/metricas.json  (histórico)
#   docs/metricas.html  (painel: URL_BASE_PUBLICA/metricas.html)
# ---------------------------------------------------------------------------

name: Metricas Instagram

on:
  schedule:
    - cron: "17 13 * * *"     # 10h17 de Brasília, todo dia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metricas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar métricas e gerar o painel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_MODO: ${{ vars.IG_MODO || 'instagram_login' }}
        run: |
          pip install -q requests
          python -m src.metricas
      - name: Salvar no repositório
        run: |
          git config user.name  "lotofacil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/metricas.json docs/metricas.html
          git diff --staged --quiet && exit 0
          git commit -m "Metricas $(date +%d/%m/%Y)"
          git pull --rebase --quiet
          git push
