# ---------------------------------------------------------------------------
# ROBÔ DA LOTOFÁCIL — execução automática
# ---------------------------------------------------------------------------
# CALENDÁRIO DA LOTOFÁCIL (desde 19/07/2026):
#   segunda a sexta -> sorteio às 21h
#   domingo         -> sorteio às 11h
#   sábado          -> não há sorteio
#
# O robô roda depois de cada apuração, no horário de Brasília, com 1h30 de
# folga para a Caixa publicar o resultado oficial:
#   segunda a sexta -> 22h30 (= 01:30 UTC do dia seguinte, terça a sábado)
#   domingo         -> 12h30 (= 15:30 UTC do mesmo domingo)
#
# TENTATIVAS EXTRAS (22h45, 23h00, 23h15 / 12h45): o agendamento nativo do
# GitHub (schedule:) pode atrasar ou até deixar de disparar em períodos de
# baixa atividade do repositório — já aconteceu aqui (ficou 13 dias sem
# rodar sozinho, entre 11/08 e 24/08, sem nenhum aviso). Como a geração dos
# jogos usa o número do concurso como semente (sempre dá o mesmo resultado)
# e a publicação só acontece se ainda não tiver sido feita, rodar de novo
# nesses horários extras é seguro: se a tentativa das 22h30 já publicou, as
# seguintes só constatam isso e não fazem nada.
#
# Atenção ao formato: o GitHub numera os dias de 0 a 6, sendo 0 = domingo.
# Não existe o dia 7 — usar "2-7" faz o GitHub rejeitar o arquivo inteiro.
# ---------------------------------------------------------------------------

name: Lotofacil Bot

on:
  schedule:
    - cron: "30 1 * * 2-6"    # seg a sex, 22h30 de Brasília (tentativa 1)
    - cron: "45 1 * * 2-6"    # seg a sex, 22h45 de Brasília (tentativa 2)
    - cron: "0 2 * * 2-6"     # seg a sex, 23h00 de Brasília (tentativa 3)
    - cron: "15 2 * * 2-6"    # seg a sex, 23h15 de Brasília (tentativa 4)
    - cron: "30 15 * * 0"     # domingo, 12h30 de Brasília (tentativa 1)
    - cron: "45 15 * * 0"     # domingo, 12h45 de Brasília (tentativa 2)
  workflow_dispatch:        # permite rodar na mão pelo site do GitHub
    inputs:
      simular:
        description: "Rodar sem publicar de verdade"
        type: boolean
        default: false

permissions:
  contents: write           # necessário para o robô salvar os dados no repositório

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ETAPA 1 — gera tudo, mas AINDA NÃO publica.
      # O Instagram e o TikTok não recebem o arquivo: eles buscam a imagem
      # numa URL pública. Então a imagem precisa estar no ar antes.
      - name: Gerar os jogos, as imagens e as legendas
        env:
          URL_BASE_PUBLICA: ${{ vars.URL_BASE_PUBLICA }}
        run: python -m src.executar --sem-publicar

      # ETAPA 2 — coloca as imagens no ar (GitHub Pages serve a pasta docs/)
      - name: Publicar as imagens no site
        run: |
          git config user.name  "lotofacil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          git diff --staged --quiet || git commit -m "Concurso automatico $(date +%d/%m/%Y)"
          git push

      # ETAPA 3 — só agora publica nas redes. O próprio código espera a imagem
      # ficar acessível antes de chamar a API.
      - name: Publicar no Instagram e no TikTok
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_MODO: ${{ vars.IG_MODO || 'instagram_login' }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          TIKTOK_PRIVACIDADE: ${{ vars.TIKTOK_PRIVACIDADE || 'SELF_ONLY' }}
          URL_BASE_PUBLICA: ${{ vars.URL_BASE_PUBLICA }}
        run: |
          if [ "${{ inputs.simular }}" = "true" ]; then
            python -m src.executar --somente-publicar --simular
          else
            python -m src.executar --somente-publicar
          fi

      - name: Anexar as imagens ao histórico da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pecas-do-dia
          path: saidas/
          retention-days: 14
