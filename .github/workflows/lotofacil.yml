# ---------------------------------------------------------------------------
# ROBÔ DA LOTOFÁCIL — execução automática
# ---------------------------------------------------------------------------
# COMO O HORÁRIO FUNCIONA AGORA (desde 24/10/2026)
#
# O agendador do GitHub atrasa — chegou a ~5h em out/2026 e já ficou 13 dias
# sem disparar (11/08 a 24/08). Por isso o robô não depende mais do horário
# exato: ele COMEÇA ANTES do sorteio e fica esperando a Caixa publicar o
# resultado (src/aguardar.py). Assim que sai, gera e publica na hora.
#
#   19h37 (todo dia)  -> execução principal das noites de sorteio (21h)
#   09h37 (todo dia)  -> execução principal dos domingos (sorteio 11h)
#   22h23, 23h07, 13h13 -> reservas, caso a principal atrase ou falhe
#
# Os disparos são diários: o próprio robô lê na Caixa se há sorteio no dia e,
# se não houver, encerra em poucos segundos. Mudança de calendário (como o
# sábado extra de 24/10) passa a ser tratada sozinha.
#
# Rodar de novo é seguro: os jogos usam o concurso como semente e o registro
# de publicações (data/publicacoes.json) agora é salvo no repositório depois
# de cada publicação — antes ele se perdia e as reservas publicavam de novo.
#
# Minutos "quebrados" de propósito: o GitHub congestiona nos minutos redondos.
# Atenção ao formato: o GitHub numera os dias de 0 a 6, sendo 0 = domingo.
# ---------------------------------------------------------------------------

name: Lotofacil Bot

on:
  schedule:
    - cron: "37 22 * * *"     # 19h37 de Brasília — principal (sorteio 21h)
    - cron: "37 12 * * *"     # 09h37 de Brasília — principal (domingo 11h)
    - cron: "23 1 * * *"      # 22h23 de Brasília — reserva
    - cron: "7 2 * * *"       # 23h07 de Brasília — reserva
    - cron: "13 16 * * *"     # 13h13 de Brasília — reserva (domingo)
  workflow_dispatch:        # permite rodar na mão pelo site do GitHub
    inputs:
      simular:
        description: "Rodar sem publicar de verdade"
        type: boolean
        default: false

permissions:
  contents: write           # necessário para o robô salvar os dados no repositório

# Uma execução por vez: a reserva espera a principal terminar em vez de
# rodar em paralelo e publicar em dobro.
concurrency:
  group: lotofacil-bot
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 330    # inclui até ~4h30 de espera pelo resultado

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Aguardar o resultado da Caixa
        id: espera
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Execução manual — sem espera."
            echo "seguir=true" >> "$GITHUB_OUTPUT"
          else
            pip install -q requests
            python -m src.aguardar
          fi

      - name: Instalar dependências
        if: steps.espera.outputs.seguir == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ETAPA 1 — gera tudo (jogos, imagens, Reel, legendas), mas AINDA NÃO publica.
      # O Instagram e o TikTok não recebem o arquivo: eles buscam a imagem
      # (e o vídeo) numa URL pública. Então precisam estar no ar antes.
      - name: Gerar os jogos, as imagens, o Reel e as legendas
        if: steps.espera.outputs.seguir == 'true'
        env:
          URL_BASE_PUBLICA: ${{ vars.URL_BASE_PUBLICA }}
        run: python -m src.executar --sem-publicar

      # ETAPA 2 — coloca as imagens no ar (GitHub Pages serve a pasta docs/)
      - name: Publicar as imagens no site
        if: steps.espera.outputs.seguir == 'true'
        run: |
          git config user.name  "lotofacil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          git diff --staged --quiet || git commit -m "Concurso automatico $(date +%d/%m/%Y)"
          git pull --rebase --quiet || true
          git push

      # ETAPA 3 — só agora publica nas redes. O próprio código espera a imagem
      # ficar acessível antes de chamar a API.
      - name: Publicar no Instagram e no TikTok
        if: steps.espera.outputs.seguir == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_MODO: ${{ vars.IG_MODO || 'instagram_login' }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          TIKTOK_PRIVACIDADE: ${{ vars.TIKTOK_PRIVACIDADE || 'SELF_ONLY' }}
          URL_BASE_PUBLICA: ${{ vars.URL_BASE_PUBLICA }}
        run: |
          if [ "${{ inputs.simular }}" = "true" ]; then
            python -m src.executar --somente-publicar --simular
          else
            python -m src.executar --somente-publicar
          fi

      # ETAPA 4 — salva o registro do que foi publicado. Sem isso, a execução
      # seguinte não sabe que já publicou e posta tudo de novo.
      - name: Salvar o registro de publicações
        if: always() && steps.espera.outputs.seguir == 'true'
        run: |
          git add data/publicacoes.json || true
          git diff --staged --quiet && exit 0
          git commit -m "Registro de publicacoes $(date +%d/%m/%Y)"
          git pull --rebase --quiet || true
          git push

      - name: Anexar as imagens ao histórico da execução
        if: always() && steps.espera.outputs.seguir == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pecas-do-dia
          path: saidas/
          retention-days: 14
