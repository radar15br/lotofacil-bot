# ---------------------------------------------------------------------------
# ROBÔ DA LOTOFÁCIL — execução automática
# ---------------------------------------------------------------------------
# CALENDÁRIO DA LOTOFÁCIL (desde 19/07/2026):
#   segunda a sexta -> sorteio às 20h
#   domingo         -> sorteio às 11h
#   sábado          -> não há sorteio
#
# O robô roda depois de cada apuração, no horário de Brasília:
#   segunda a sexta -> 21h30  (= 00:30 UTC do dia seguinte, terça a sábado)
#   domingo         -> 12h30  (= 15:30 UTC do mesmo domingo)
#
# Atenção ao formato: o GitHub numera os dias de 0 a 6, sendo 0 = domingo.
# Não existe o dia 7 — usar "2-7" faz o GitHub rejeitar o arquivo inteiro.
# ---------------------------------------------------------------------------

name: Lotofacil Bot

on:
  schedule:
    - cron: "30 0 * * 2-6"    # seg a sex, 21h30 de Brasília
    - cron: "30 15 * * 0"    # domingo, 12h30 de Brasília
  workflow_dispatch:        # permite rodar na mão pelo site do GitHub
    inputs:
      simular:
        description: "Rodar sem publicar de verdade"
        type: boolean
        default: false

permissions:
  contents: write           # necessário para o robô salvar os dados no repositório

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar o robô
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_MODO: ${{ vars.IG_MODO || 'instagram_login' }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          TIKTOK_PRIVACIDADE: ${{ vars.TIKTOK_PRIVACIDADE || 'SELF_ONLY' }}
          URL_BASE_PUBLICA: ${{ vars.URL_BASE_PUBLICA }}
        run: |
          if [ "${{ inputs.simular }}" = "true" ]; then
            python -m src.executar --simular
          else
            python -m src.executar
          fi

      - name: Guardar o que foi gerado
        run: |
          git config user.name  "lotofacil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          git diff --staged --quiet || git commit -m "Concurso automatico $(date +%d/%m/%Y)"
          git push

      - name: Anexar as imagens ao histórico da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pecas-do-dia
          path: saidas/
          retention-days: 14
